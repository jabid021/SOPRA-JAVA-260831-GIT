
<form id="passwordForm">
  <input
    type="password"
    id="password"
    placeholder="Saisir votre password"
    required
  />

  <ul id="passwordErrors">
    <li id="length">Au moins 10 caractères</li>
    <li id="uppercase">Au moins une majuscule</li>
    <li id="lowercase">Au moins une minuscule</li>
    <li id="number">Au moins un chiffre</li>
    <li id="special">Au moins un caractère spécial</li>
    <li id="spaces">Aucun espace</li>
  </ul>

  <button type="submit">Valider</button>
</form>

<style>
  #passwordErrors li {
    color: red;
  }

  #passwordErrors li.valid {
    color: green;
  }
</style>

<script>
  const password = document.getElementById("password");
  const form = document.getElementById("passwordForm");

  function validatePassword() {
    const value = password.value;

    const rules = {
      length: value.length >= 10,
      uppercase: /[A-Z]/.test(value),
      lowercase: /[a-z]/.test(value),
      number: /\d/.test(value),
      special: /[^a-zA-Z0-9\s]/.test(value),
      spaces: !/\s/.test(value)
    };

    Object.entries(rules).forEach(([id, valid]) => {
      document.getElementById(id)
        .classList.toggle("valid", valid);
    });

    return Object.values(rules).every(Boolean);
  }

  password.addEventListener("input", validatePassword);

  form.addEventListener("submit", (event) => {
    if (!validatePassword()) {
      event.preventDefault();
    }
  });
</script>
