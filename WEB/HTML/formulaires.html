<!--

champs texte (input) => text, email, password, number, date, time, week, url, file, tel*(), hidden

Zone de texte => TexteArea

Choix : unique (0,1) radio / multiple (0,*) checkbox

Liste deroulante => (Select / Option)

Buttons => submit / reset / button

-->
<h1>Formulaire d'ajout</h1>

<form>

  <fieldset>
    <legend>Bloc 1</legend>
    <table>
      <tr><td>Login*</td><td><input required type="text" value="Jordan" placeholder="Saisir votre login"></td></tr>
      <tr><td>Password</td><td><input type="password" placeholder="Saisir votre password"></td></tr>
      <tr><td>Email</td><td><input type="email" placeholder="Saisir votre email"></td></tr>
      <tr><td>Age</td><td><input type="number" value="33" placeholder="Saisir votre age"></td></tr>
    </table>
  </fieldset>


  <fieldset>
    <legend>Bloc 2</legend>
    <table>
      <tr><td>Date du Rdv</td><td><input type="date"></td></tr>
      <tr><td>Heure du Rdv</td><td><input type="time" value="08:55" ></td></tr>
      <tr><td>Semaine de conges</td><td><input type="week"></td></tr>
      <tr><td>Annee Naissance</td>
        <td>
          <select>
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
          </select>
        </td>
      </tr>

      <tr><td>Choix de votre OS</td>
        <td>
          <select>
            <option>MacOs</option>
            <option selected>Linux</option>
            <option>Windows</option>
          </select>
        </td>
      </tr>
    </table>

  </fieldset>


  <fieldset>
    <legend>Bloc 3</legend>
    <table>
      <tr><td>Commentaire</td><td><textarea cols="80" rows="5" placeholder="Saisir votre commentaire"></textarea></td></tr>
      <tr><td>Civilite</td>
        <td>
          <input checked id="civ-homme" name="civ" type="radio"><label for="civ-homme">Homme</label>
          <input id="civ-femme" name="civ" type="radio"><label for="civ-femme">Femme</label>
          <input id="civ-nb" name="civ" type="radio"> <label for="civ-nb">NB</label>
        </td>
      </tr>

      <tr><td>Langage Pref</td>
        <td>
          <input id="lng-java" type="checkbox"><label for="lng-java">JAVA</label>
          <input id="lng-sql" type="checkbox"><label for="lng-sql">SQL</label>
          <input checked id="lng-jpa" type="checkbox"> <label for="lng-jpa">JPA</label>
        </td>
      </tr>


      <tr>
        <td>Votre CV</td>
        <td><input type="file"></td>
      </tr>
    </table>
  </fieldset>
  <input value="Envoyer" type="submit">
</form>
