<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>MKWTop</title>
  <style>
    body{margin:0;
      background-image: url("img/mkwbk.jpg");
      background-size:cover;
    }

    @font-face {
        font-family: 'Archivo_Black';
        src: url('fonts/Archivo_Black/ArchivoBlack-Regular.ttf') format('truetype');
    }

    @font-face {
        font-family: 'Inter';
        src: url('fonts/Inter/Inter-VariableFont_opsz,wght.ttf') format('truetype');
    }

    header{
      height:10vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #title{
      background-color: #eaeaea;
      border: 3px solid #7aa0ff;
      box-shadow: 0 0 12px #7aa0ff80;
      padding: 18px 40px;
      border-radius: 14px;
    }

    #title h1 {
      font-family: "Inter", sans-serif;
      font-size: 32px;
      color: #3a3a3a;
      letter-spacing: 1px;
      margin: 0;
    }

    #title:hover {
      animation: zoom 1s ease-out;
    }

    main{
      display:flex;
      flex-direction:column;
      height:75vh;
      margin-top:10px;
      margin-right: 10vw;
      margin-left:10vw;
    }

    .table-container {
      background-color: #FFFFFF40;
      border-radius: 25px;
      padding: 25px;
      border: 2px solid #FFFFFF66;
      backdrop-filter: blur(5px);
      animation: slideIn 0.6s ease-out;
    }

    .table{
      display: flex;
      border-collapse: collapse;
      justify-content: center;
    }

    tr{
      background-color: #262422;
    }

    th {
      text-align: center;
      color: black;
      font-family: "Inter", sans-serif;
      font-size:15px;
    }

    td img{
       display: block;
       width: 100%;
    }

    td img:hover{
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px black);
      transition: 0.2s;
    }

    .card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #1f1f1f;
      opacity: 0.95;
      padding: 20px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px black;
    }

    .card img {
      width: 300px;
      border-radius: 10px;
    }

    #card h3{
      font-family:"Archivo_Black";
      font-size: 20px;
      letter-spacing: 1px;
      color: #eaeaea;
    }

    #card p{
      font-family: sans-serif;
      color: #eaeaea;
    }

    #cardAudio{
      display: block;
      margin: 0 auto;
    }

    #cardClose {
      color: black;
      font-size: 15px;
      font-family: sans-serif;
      height: 30px;
      border-radius: 5px;
      background-image: linear-gradient(135deg, #ff99ff 25%, #99ffff 85%);
      outline: none;
      border: none;
      transition: all 0.3s ease-in-out;
      cursor: pointer;
    }

    #cardDesc{
      font-size:15px;
    }

    #cardClose:hover {
      transform: translateY(3px);
    }

    .hidden {
      display: none;
    }

    footer{
      height:15vh;
    }

    @keyframes slideIn {
      from {transform: translateY(40px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }

    @keyframes zoom {
      from {font-size: 50px;}
      to {font-size: 55px;}
    }

  </style>
</head>

  <div id="toad" hidden>

  <div id="card" class="card hidden">
    <img id="cardImg">
    <h3 id="cardTitle"></h3>
    <audio id="cardAudio" controls></audio>
    <p id="cardDesc"></p>
    <button id="cardClose">Fermer</button>
  </div>

  <script charset="utf-8">

    let circuits = document.querySelectorAll(".circuit");

    let card = document.getElementById("card");
    let cardImg = document.getElementById("cardImg");
    let cardTitle = document.getElementById("cardTitle");
    let cardAudio = document.getElementById("cardAudio");
    let cardDesc = document.getElementById("cardDesc");
    let cardClose = document.getElementById("cardClose");

    let cardToad = document.getElementById("toadImg");

    let varTimerToad;

    circuits.forEach(circuit => {circuit.onclick = function() {
      cardImg.src = circuit.src;
      cardTitle.textContent = circuit.dataset.title;
      cardDesc.textContent = circuit.dataset.desc;

      if (circuit.dataset.audio) {
      cardAudio.src = circuit.dataset.audio;
      cardAudio.style.display = "block";
      } else {
        cardAudio.src = "";
        cardAudio.style.display = "none";
      }
      card.classList.remove("hidden");
      }
    })

    cardClose.onclick = function() {
      card.classList.add("hidden");
    }

    varTimerToad = setTimeout(function() {
      cardImg.src = cardToad.src;
      cardTitle.textContent = "";
      cardDesc.textContent = "Salut humain... Bienvenue sur LE classement ultime des circuits Mario Kart Wii. Attache ta ceinture et c'est partiiiit!!!";
      cardAudio.style.display = "none";
      card.classList.remove("hidden");
    }, 1000);

  </script>
