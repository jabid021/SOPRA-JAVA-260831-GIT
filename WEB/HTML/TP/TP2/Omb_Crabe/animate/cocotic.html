<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crabe des cocotiers</title>

    <style>

        /* =========================================================
           PAGE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 70%,
                    #25445a 0%,
                    #182b39 45%,
                    #101a23 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================================
           SCÈNE
        ========================================================= */

        .scene {
            position: relative;

            width: 650px;
            height: 520px;
        }


        /* =========================================================
           OMBRE
        ========================================================= */

        .ombre {
            position: absolute;

            left: 50%;
            bottom: 55px;

            width: 380px;
            height: 55px;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.35);

            border-radius: 50%;

            filter: blur(8px);
        }


        /* =========================================================
           NOIX DE COCO
        ========================================================= */

        .coco {
            position: absolute;

            left: 50%;
            bottom: 75px;

            width: 330px;
            height: 270px;

            transform: translateX(-50%);

            border-radius: 48% 52% 50% 50% / 45% 45% 55% 55%;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #8f6a45 0%,
                    #68472e 25%,
                    #49301f 55%,
                    #2e2118 100%
                );

            box-shadow:
                inset 20px 15px 0 rgba(170, 125, 70, 0.15),
                inset -25px -25px 0 rgba(0, 0, 0, 0.22),
                0 20px 20px rgba(0,0,0,0.25);

            overflow: hidden;

            animation: coco-balance 3s ease-in-out infinite;
        }


        /* Fibres de la noix */

        .fibre {
            position: absolute;

            width: 90px;
            height: 10px;

            background: #9a7047;

            border-radius: 50%;

            opacity: 0.55;

            transform: rotate(-20deg);
        }

        .f1 {
            left: 30px;
            top: 45px;
        }

        .f2 {
            left: 110px;
            top: 80px;
            transform: rotate(15deg);
        }

        .f3 {
            left: 185px;
            top: 45px;
            transform: rotate(-30deg);
        }

        .f4 {
            left: 50px;
            top: 145px;
            transform: rotate(20deg);
        }

        .f5 {
            left: 170px;
            top: 150px;
            transform: rotate(-15deg);
        }

        .f6 {
            left: 105px;
            top: 205px;
            transform: rotate(8deg);
        }


        /* Trois petits trous */

        .oeil-coco {
            position: absolute;

            width: 27px;
            height: 27px;

            background: #24170f;

            border-radius: 50%;
        }

        .coco-oeil1 {
            left: 125px;
            top: 45px;
        }

        .coco-oeil2 {
            left: 165px;
            top: 50px;
        }

        .coco-oeil3 {
            left: 145px;
            top: 75px;
        }


        /* =========================================================
           CRABE
        ========================================================= */

        .crabe {
            position: absolute;

            left: 50%;
            bottom: 245px;

            width: 470px;
            height: 260px;

            transform: translateX(-50%);

            z-index: 5;

            /*
             * 32 secondes :
             *
             * 0-25%   : reste sur la noix
             * 25-35%  : descend
             * 35-55%  : marche au sol
             * 55-65%  : revient vers la noix
             * 65-75%  : remonte
             * 75-100% : reste sur la noix
             */
            animation: promenade 32s ease-in-out infinite;
        }


        /* =========================================================
           PIXELS
        ========================================================= */

        .pixel {
            position: absolute;

            width: 14px;
            height: 14px;
        }


        /* =========================================================
           COULEURS
        ========================================================= */

        .ombre-crabe {
            background: #301d17;
        }

        .brun-fonce {
            background: #4b2b20;
        }

        .brun {
            background: #75402a;
        }

        .brun-clair {
            background: #995637;
        }

        .orange {
            background: #b96a3c;
        }

        .orange-clair {
            background: #d9894b;
        }

        .sable {
            background: #c49a68;
        }

        .sable-clair {
            background: #e0bd83;
        }

        .noir {
            background: #17110f;
        }

        .reflet {
            background: #f0d29a;
        }


        /* =========================================================
           DÉPLACEMENT DU CRABE
           ========================================================= */

        @keyframes promenade {

            /* -------------------------------------------------
               RESTE SUR LA NOIX
               ------------------------------------------------- */

            0% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            18% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            25% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }


            /* -------------------------------------------------
               DESCENTE
               ------------------------------------------------- */

            32% {
                transform:
                    translateX(-50%)
                    translateY(75px);
            }


            /* -------------------------------------------------
               MARCHE AU SOL
               ------------------------------------------------- */

            40% {
                transform:
                    translateX(-50%)
                    translateY(125px);
            }

            48% {
                transform:
                    translateX(-58%)
                    translateY(125px);
            }

            55% {
                transform:
                    translateX(-42%)
                    translateY(125px);
            }


            /* -------------------------------------------------
               RETOUR VERS LA NOIX
               ------------------------------------------------- */

            60% {
                transform:
                    translateX(-50%)
                    translateY(125px);
            }

            66% {
                transform:
                    translateX(-50%)
                    translateY(75px);
            }


            /* -------------------------------------------------
               REMONTÉE
               ------------------------------------------------- */

            72% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }


            /* -------------------------------------------------
               REPOS
               ------------------------------------------------- */

            80% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            100% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }


        /* =========================================================
           RESPIRATION
        ========================================================= */

        .corps {
            animation: respiration 2.8s ease-in-out infinite;
        }

        @keyframes respiration {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }

            100% {
                transform: translateY(0);
            }
        }


        /* =========================================================
           PATTES
        ========================================================= */

        .patte-gauche-1 {
            transform-origin: 115px 165px;
            animation: patte1 0.8s ease-in-out infinite alternate;
        }

        .patte-gauche-2 {
            transform-origin: 135px 170px;
            animation: patte2 0.8s ease-in-out infinite alternate;
        }

        .patte-gauche-3 {
            transform-origin: 150px 175px;
            animation: patte3 0.8s ease-in-out infinite alternate;
        }

        .patte-droite-1 {
            transform-origin: 355px 165px;
            animation: patte2 0.8s ease-in-out infinite alternate;
        }

        .patte-droite-2 {
            transform-origin: 335px 170px;
            animation: patte3 0.8s ease-in-out infinite alternate;
        }

        .patte-droite-3 {
            transform-origin: 320px 175px;
            animation: patte1 0.8s ease-in-out infinite alternate;
        }

        @keyframes patte1 {

            from {
                transform: rotate(-3deg);
            }

            to {
                transform: rotate(8deg);
            }
        }

        @keyframes patte2 {

            from {
                transform: rotate(5deg);
            }

            to {
                transform: rotate(-8deg);
            }
        }

        @keyframes patte3 {

            from {
                transform: rotate(-6deg);
            }

            to {
                transform: rotate(5deg);
            }
        }


        /* =========================================================
           PINCES
        ========================================================= */

        .pince-gauche {
            transform-origin: 110px 125px;

            animation:
                pince-gauche 1.6s ease-in-out infinite;
        }

        .pince-droite {
            transform-origin: 360px 125px;

            animation:
                pince-droite 1.6s ease-in-out infinite;
        }

        @keyframes pince-gauche {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(-5deg);
            }

            60% {
                transform: rotate(3deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes pince-droite {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(5deg);
            }

            60% {
                transform: rotate(-3deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }


        /* =========================================================
           MOUVEMENT DE LA NOIX
        ========================================================= */

        @keyframes coco-balance {

            0% {
                transform:
                    translateX(-50%)
                    rotate(-1deg);
            }

            50% {
                transform:
                    translateX(-50%)
                    rotate(1deg);
            }

            100% {
                transform:
                    translateX(-50%)
                    rotate(-1deg);
            }
        }

    </style>

</head>
