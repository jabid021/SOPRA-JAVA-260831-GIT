
# Configuration JPA
quarkus.datasource.jdbc.url = jdbc:mysql://db/projet_quest
quarkus.datasource.username = root
quarkus.datasource.password =

quarkus.datasource.db-kind = mysql

quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.log.sql = true

# Configuration /api pour les users authentiés
quarkus.http.auth.permission.auth.paths = /api/user/auth
quarkus.http.auth.permission.auth.policy = permit

quarkus.http.auth.permission.api.paths = /*
quarkus.http.auth.permission.api.policy = authenticated


# Configuration JWT
# - Activation de JWT
quarkus.smallrye-jwt.enabled = true

# - Clé privée pour signer JWT
smallrye.jwt.sign.key.location = classpath:privateKey.pem

# - Configuration de la durée de vie du jeton à 1h
smallrye.jwt.new-token.lifespan = 3600

# - Vérification du jeton
mp.jwt.verify.issuer = quest-quarkus-issuer
mp.jwt.verify.publickey.location = classpath:publicKey.pem


# Configuration Politique CORS
quarkus.http.cors.enabled = true

quarkus.http.cors.origins = http://localhost:4200
