
<h1>Ma première application Angular</h1>

<p>
  {{ 4 + 6 }}
</p>

<p>
  {{ title() }}
</p>

<p [style.color]="couleur">
  {{ prenom }}
</p>

<select [(ngModel)]="couleur">
  <option value="black">Noir</option>
  <option value="red">Rouge</option>
  <option value="blue">Bleu</option>
  <option value="#51a5ae">Bleu vert</option>
</select>

<input type="color" [(ngModel)]="couleur" />

<div>
  <input type="text" [value]="prenom" (input)="onInput($event)" />
  <button (click)="modifierPrenom()">Modifier prenom</button>
</div>

<input type="text" [(ngModel)]="prenom" />
