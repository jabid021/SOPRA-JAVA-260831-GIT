<h1>Liste des matières</h1>

<form (submit)="ajouterOuModifier()" [formGroup]="formMatiereGroup">
  <div>
    <!-- <input type="text" formControlName="libelle" /> -->
    <input type="text" [formControl]="formMatiereLibelleCtrl" />
  </div>

  @if (formMatiereLibelleCtrl.dirty && formMatiereLibelleCtrl.hasError('required')) {
    <div>
      Le libellé est obligatoire !
    </div>
  }

  <div>
    <button [disabled]="formMatiereGroup.invalid" type="submit">Ajouter</button>
  </div>
</form>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Libellé</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    @for (matiere of (matieres$ | async); track matiere.id) {
      <tr>
        <td>{{ matiere.id }}</td>
        <td>{{ matiere.libelle }}</td>
        <td>
          <button (click)="editer(matiere)">Editer</button>
          <button (click)="supprimer(matiere)">Supprimer</button>
        </td>
      </tr>
    }
  </tbody>
</table>
