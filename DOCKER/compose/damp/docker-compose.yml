name: damp

services:
  db:
    image: mysql:8.4.13
    container_name: damp-db

    # ports:
      # - 3308:3306

    environment:
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql

    networks:
      - damp

    # Mécanique que Docker va exécuter pour vérifier si le service est UP
    healthcheck:
      # Commande de test pour s'assurer que mysql est UP
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 3s
      retries: 10
      interval: 5s

  pma:
    image: phpmyadmin
    container_name: damp-pma

    environment:
      PMA_HOST: db
      # PMA_HOST: damp-db

    ports:
      - 81:80

    networks:
      - damp

    # On attend que "db" soit démarré avant de démarrer celui-ci
    # depends_on:
    #   - db

    # On attend que "db" soit démarré ET en pleine santée : le service mysql est UP
    depends_on:
      db:
        condition: service_healthy

networks:
  damp:
    name: damp

volumes:
  db-data:
    name: damp-db-data
